<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rudaki Residence — 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d1726;--navy2:#142238;--gold:#c9a24a;--gold2:#e7c978;--cream:#f4ecdc;--txt:#e9e4d8;--mut:#9aa3b2;--line:rgba(201,162,74,.25)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0b1320;font-family:Manrope,system-ui,sans-serif;color:var(--txt);-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#lbl{position:fixed;inset:0;pointer-events:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.serif{font-family:'Cormorant Garamond',serif}
/* loader */
#load{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#1b2b45,#070d17);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .8s}
#load h1{font-family:'Cormorant Garamond',serif;font-size:44px;letter-spacing:.32em;color:var(--gold2);font-weight:600;text-align:center}
#load p{color:var(--mut);letter-spacing:.2em;font-size:12px;text-transform:uppercase}
.bar{width:220px;height:2px;background:#22324d;overflow:hidden}.bar i{display:block;height:100%;width:40%;background:var(--gold);animation:ld 1.2s infinite ease-in-out}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
/* sidebar */
#side{position:fixed;left:14px;top:14px;bottom:14px;width:360px;background:rgba(13,23,38,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;z-index:10;transition:transform .45s cubic-bezier(.2,.8,.2,1);box-shadow:0 20px 60px rgba(0,0,0,.4)}
#side.hide{transform:translateX(calc(-100% - 20px))}
.brand{padding:22px 22px 14px;border-bottom:1px solid var(--line)}
.brand h1{font-family:'Cormorant Garamond',serif;font-size:30px;letter-spacing:.18em;color:var(--gold2);font-weight:600;line-height:1}
.brand .sub{font-size:11.5px;color:var(--mut);margin-top:8px;letter-spacing:.04em;line-height:1.5}
.tabs{display:flex;gap:4px;padding:10px 14px 0}
.tabs button{flex:1;padding:10px 6px;font-size:13px;font-weight:600;color:var(--mut);border-bottom:2px solid transparent;letter-spacing:.02em}
.tabs button.on{color:var(--gold2);border-color:var(--gold)}
.pane{flex:1;overflow-y:auto;padding:12px 14px 16px;display:none}.pane.on{display:block}
.pane::-webkit-scrollbar{width:6px}.pane::-webkit-scrollbar-thumb{background:#2a3a55;border-radius:3px}
.fl{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;cursor:pointer;border:1px solid transparent;transition:.2s}
.fl:hover{background:rgba(201,162,74,.08);border-color:var(--line)}
.fl.on{background:linear-gradient(90deg,rgba(201,162,74,.22),rgba(201,162,74,.04));border-color:var(--gold)}
.fl .n{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:700;width:38px;text-align:center;color:var(--gold2)}
.fl .t{flex:1;font-size:13px}.fl .t small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.fl .f{font-size:11px;color:#7fd3a8;background:rgba(127,211,168,.12);padding:3px 8px;border-radius:20px;white-space:nowrap}
.sec{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:14px 4px 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 12px;border-radius:20px;border:1px solid #2c3d5a;font-size:12.5px;color:var(--txt)}
.chip.on{background:var(--gold);border-color:var(--gold);color:#1a1408;font-weight:700}
.rng{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mut)}
.rng input{flex:1;accent-color:var(--gold)}
.cnt{font-size:12px;color:var(--mut);margin:12px 4px 8px}
.ac{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid #1f2d45;margin-bottom:7px;cursor:pointer;transition:.2s}
.ac:hover{border-color:var(--gold);background:rgba(201,162,74,.07)}
.ac .b{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#101820;flex:none}
.ac .i{flex:1;font-size:13px}.ac .i small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.ac .a{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:700;color:var(--gold2);white-space:nowrap}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fact{background:rgba(255,255,255,.03);border:1px solid #1f2d45;border-radius:12px;padding:12px}
.fact b{font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--gold2);display:block;line-height:1}
.fact span{font-size:11.5px;color:var(--mut)}
.about p{font-size:13px;line-height:1.6;color:#cfd3db;margin:10px 2px}
.disc{font-size:10.5px;color:#7b8597;line-height:1.5;margin-top:12px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--mut);margin:4px 2px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* toolbar */
#tools{position:fixed;top:14px;right:14px;display:flex;gap:8px;z-index:11;flex-wrap:wrap;justify-content:flex-end;max-width:60vw}
.tb{height:40px;min-width:40px;padding:0 13px;border-radius:12px;background:rgba(13,23,38,.82);backdrop-filter:blur(10px);border:1px solid var(--line);font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.tb:hover,.tb.on{border-color:var(--gold);color:var(--gold2)}
.lang button{padding:0 9px;height:100%;font-size:12px;font-weight:700;color:var(--mut)}.lang button.on{color:var(--gold2)}
.lang{padding:0 4px}
#menuBtn{position:fixed;left:14px;top:14px;z-index:9}
/* floor hud */
#hud{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:11;display:none;align-items:center;gap:10px;background:rgba(13,23,38,.88);border:1px solid var(--gold);border-radius:16px;padding:8px 10px 8px 18px;backdrop-filter:blur(10px)}
#hud.on{display:flex}
#hud .big{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;color:var(--gold2);line-height:1}
#hud .lab{font-size:11px;color:var(--mut);line-height:1.3;margin-right:6px}
#hud .tb{height:36px;min-width:36px}
/* tooltip */
#tip{position:fixed;z-index:20;pointer-events:none;background:rgba(10,17,29,.94);border:1px solid var(--gold);border-radius:10px;padding:8px 12px;font-size:12.5px;display:none;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#tip b{color:var(--gold2);font-size:14px}
/* labels */
.albl{font-size:11px;font-weight:700;color:#fff;background:rgba(13,23,38,.78);border:1px solid rgba(255,255,255,.25);padding:3px 7px;border-radius:8px;white-space:nowrap;text-align:center;line-height:1.25}
.albl small{display:block;font-weight:500;color:var(--gold2);font-size:10px}
/* drawer */
#drw{position:fixed;right:14px;top:66px;bottom:14px;width:410px;background:rgba(13,23,38,.92);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;z-index:12;transform:translateX(calc(100% + 30px));transition:transform .45s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.45)}
#drw.on{transform:none}
#drw .hd{padding:20px 22px 12px;border-bottom:1px solid var(--line);position:relative}
#drw .x{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:10px;border:1px solid #2c3d5a;font-size:18px}
#drw .tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
#drw h2{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:600;margin-top:4px}
#drw .ar{font-family:'Cormorant Garamond',serif;font-size:42px;color:var(--gold2);font-weight:700;line-height:1}
#drw .ar small{font-size:20px}
#drw .bd{flex:1;overflow-y:auto;padding:14px 22px 18px}
.plan{background:#f6f1e6;border-radius:14px;padding:8px;margin-bottom:12px}
.plan svg{width:100%;height:auto;display:block}
.spec{width:100%;border-collapse:collapse;font-size:13px}
.spec td{padding:8px 2px;border-bottom:1px solid #1f2d45}.spec td:last-child{text-align:right;font-weight:600}
.spec td:first-child{color:var(--mut)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.btn{padding:13px 10px;border-radius:12px;border:1px solid var(--gold);font-size:13px;font-weight:700;color:var(--gold2);display:flex;align-items:center;justify-content:center;gap:7px}
.btn.pri{background:linear-gradient(135deg,#d8b45c,#b38a35);color:#1a1206;border:none;grid-column:1/-1;font-size:14px}
.btn:hover{filter:brightness(1.12)}
.st{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px}
#sunbox{position:fixed;right:14px;top:62px;z-index:11;background:rgba(13,23,38,.82);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:10px;font-size:12px}
#sunbox input[type=range]{width:150px;accent-color:var(--gold)}
#sunbox select{background:#132036;color:var(--txt);border:1px solid #2c3d5a;border-radius:8px;padding:4px 6px;font-family:inherit;font-size:12px}
#sunT{min-width:42px;font-weight:700;color:var(--gold2)}
#drw{top:112px}

.tour-on #sunbox{display:none}
.ubadge{pointer-events:auto;cursor:pointer;min-width:34px;height:34px;padding:0 6px;border-radius:17px;background:#2fb39a;color:#fff;border:3px solid #fff;font:800 13px Manrope,sans-serif;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.35);transition:transform .15s}
.ubadge:hover{transform:scale(1.18)}.ubadge.stR{background:#f08a3c}.ubadge.stS{background:#8a9099}.ubadge.ph{background:#9a6fd6}.ubadge.ph.stR{background:#f08a3c}.ubadge.ph.stS{background:#8a9099}
.ptabs{display:flex;gap:6px;margin-bottom:8px}.ptabs button{padding:6px 14px;border-radius:20px;border:1px solid #2c3d5a;font-size:12px;font-weight:700;color:var(--mut)}.ptabs button.on{background:var(--gold);border-color:var(--gold);color:#1a1206}
.pimg{position:relative;background:#fff;border-radius:14px;overflow:hidden;margin-bottom:12px;cursor:zoom-in}.pimg img{width:100%;display:block}.pimg span{position:absolute;right:8px;top:8px;background:rgba(13,23,38,.75);color:#fff;border-radius:8px;padding:2px 8px;font-size:14px}
#lb{position:fixed;inset:0;z-index:60;background:rgba(6,10,18,.94);display:none;align-items:center;justify-content:center;overflow:hidden}#lb.on{display:flex}
#lb img{max-width:96vw;max-height:92vh;transition:transform .25s;cursor:zoom-in;background:#fff;border-radius:10px}#lb img.z{transform:scale(2.2);cursor:zoom-out}
#lbX{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;width:42px;height:42px;border-radius:12px;background:rgba(13,23,38,.85);border:1px solid var(--line);color:#fff;font-size:18px;z-index:2}
.rlbl{font:700 11px Manrope,sans-serif;color:#2b2620;background:rgba(255,255,255,.88);padding:3px 8px;border-radius:6px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.18);pointer-events:none}
.contact{margin-top:14px;background:rgba(255,255,255,.03);border:1px solid #1f2d45;border-radius:14px;padding:12px;text-align:center}.contact .sec{margin:0 0 8px;text-align:left}
.contact .cl{display:block;padding:11px;border-radius:10px;border:1px solid var(--gold);color:var(--gold2);font-weight:700;text-decoration:none;margin-bottom:8px;font-size:14px}
.contact img{width:150px;height:150px;background:#fff;border-radius:10px;padding:6px;margin-top:4px}.contact small{display:block;color:var(--mut);font-size:11px;margin-top:6px}
@media (max-width:820px){.rlbl{font-size:9.5px;padding:2px 6px}}
/* tour */
#tour{position:fixed;inset:0;z-index:30;display:none;pointer-events:none}
#tour.on{display:block}
#tour .top{position:absolute;left:14px;right:14px;top:14px;display:flex;gap:8px;align-items:center;pointer-events:auto;flex-wrap:wrap}
#tour .ttl{background:rgba(13,23,38,.85);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:13px}
#tour .ttl b{color:var(--gold2)}
.seg{display:flex;background:rgba(13,23,38,.85);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{padding:0 14px;height:40px;font-size:13px;font-weight:600;color:var(--mut)}.seg button.on{background:var(--gold);color:#1a1206}
#rooms{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;justify-content:center;max-width:94vw}
#rooms button{background:rgba(13,23,38,.85);border:1px solid var(--line);border-radius:20px;padding:9px 14px;font-size:12.5px;font-weight:600}
#rooms button:hover,#rooms button.on{border-color:var(--gold);color:var(--gold2)}
#mini{position:absolute;right:14px;top:66px;width:230px;background:rgba(246,241,230,.94);border-radius:14px;padding:6px;pointer-events:auto}
#hint{position:absolute;left:14px;bottom:70px;font-size:11.5px;color:#fff;background:rgba(13,23,38,.7);padding:8px 12px;border-radius:10px;max-width:300px;line-height:1.5}
#pad{position:absolute;left:24px;bottom:70px;display:none;pointer-events:auto;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:6px}
#pad button{background:rgba(13,23,38,.75);border:1px solid var(--line);border-radius:12px;font-size:20px;color:var(--gold2)}
#cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,255,255,.7);box-shadow:0 0 0 2px rgba(0,0,0,.25)}
#viewbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:30;display:none;gap:8px}
#viewbar.on{display:flex}
@media (max-width:820px){
 #side{left:0;right:0;top:auto;bottom:0;width:auto;height:52vh;border-radius:18px 18px 0 0}
 #side.hide{transform:translateY(calc(100% + 10px))}
 #drw{left:0;right:0;top:auto;bottom:0;width:auto;height:70vh;border-radius:18px 18px 0 0;transform:translateY(calc(100% + 20px))}
 #tools{max-width:calc(100vw - 70px)}
 .tb .tx{display:none}
 #hud{top:62px}
 #mini{width:150px}
 #hint{display:none}
 #pad{display:grid}
 .brand h1{font-size:24px}
}

#bSun{display:none}
.albl{pointer-events:auto;cursor:pointer;border-left:3px solid #2fb39a;transition:opacity .2s}
.albl.stR{border-left-color:#f08a3c}.albl.stS{border-left-color:#8a9099}.albl.ph{border-left-color:#b48cf0}
.albl:hover{background:rgba(201,162,74,.92);color:#1a1206}.albl:hover small{color:#1a1206}
.albl.hid{opacity:0;pointer-events:none}
@media (max-width:820px){
 body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
 #menuBtn{top:calc(8px + env(safe-area-inset-top));left:8px}
 #tools{top:calc(8px + env(safe-area-inset-top));right:8px;left:56px;max-width:none;gap:5px;flex-wrap:nowrap;justify-content:flex-end}
 .tb{height:38px;min-width:38px;padding:0 9px;border-radius:11px;font-size:14px}
 .lang button:not(.on){display:none}.lang button{padding:0 6px}
 #bSun{display:flex}
 #sunbox{display:none;top:calc(54px + env(safe-area-inset-top));left:8px;right:8px;justify-content:space-between;padding:8px 10px}
 #sunbox.open{display:flex}#sunbox input[type=range]{flex:1;width:auto}
 #hud{top:calc(54px + env(safe-area-inset-top));padding:5px 6px 5px 12px;gap:6px;border-radius:13px}
 #hud .big{font-size:24px}#hud .lab{font-size:10.5px}#hud .tb{height:32px;min-width:32px}
 .sunopen #hud{top:calc(104px + env(safe-area-inset-top))}
 #side{height:min(56vh,480px);padding-bottom:env(safe-area-inset-bottom)}
 #side::before{content:'';position:absolute;top:7px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:#3a4a66}
 .brand{padding:16px 16px 10px}.brand h1{font-size:21px}.brand .sub{font-size:10.5px;margin-top:5px}
 .fl{padding:7px 10px}.fl .n{font-size:20px;width:30px}
 #drw{height:min(78vh,700px);padding-bottom:env(safe-area-inset-bottom)}
 #drw h2{font-size:26px}#drw .ar{font-size:34px}#drw .bd{padding:12px 16px 16px}#drw .hd{padding:16px 16px 10px}
 .albl{font-size:9.5px;padding:2px 5px;border-radius:6px;line-height:1.2}.albl small{font-size:8.5px}
 #tip{display:none!important}
 #tour .top{top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;gap:6px}
 #tour .ttl{font-size:11px;padding:6px 10px;flex:1 1 100%;order:3}
 .seg button{height:36px;padding:0 10px;font-size:12px}
 #mini{width:118px;top:auto;bottom:calc(88px + env(safe-area-inset-bottom));right:8px}
 #rooms{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;left:8px;right:8px;transform:none;max-width:none;bottom:calc(10px + env(safe-area-inset-bottom));scrollbar-width:none}
 #rooms::-webkit-scrollbar{display:none}#rooms button{flex:none;padding:8px 12px;font-size:12px}
 #pad{left:12px;bottom:calc(64px + env(safe-area-inset-bottom));grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,46px)}
 #viewbar{bottom:calc(14px + env(safe-area-inset-bottom))}
}
</style>

<body>
<canvas id="c"></canvas>
<div id="lbl"></div>
<div id="load"><h1>RUDAKI<br>RESIDENCE</h1><div class="bar"><i></i></div><p id="loadTxt">Загрузка 3D-модели…</p><p style="font-size:10px;letter-spacing:.1em;opacity:.6">ҶДММ «Бурҷи Бохтар»</p></div>

<button id="menuBtn" class="tb" title="Menu">☰</button>
<aside id="side">
 <div class="brand"><h1>RUDAKI RESIDENCE</h1><div class="sub" id="bSub"></div></div>
 <div class="tabs"><button data-tab="floors" class="on" data-i="tFloors"></button><button data-tab="apts" data-i="tApts"></button><button data-tab="about" data-i="tAbout"></button></div>
 <div class="pane on" id="p-floors">
  <div class="legend" id="legend"></div>
  <div id="flList"></div>
 </div>
 <div class="pane" id="p-apts">
  <div class="sec" data-i="fRooms"></div><div class="chips" id="fRooms"></div>
  <div class="sec" data-i="fBlock"></div><div class="chips" id="fBlock"></div>
  <div class="sec" data-i="fEnt"></div><div class="chips" id="fEnt"></div>
  <div class="sec" data-i="fArea"></div>
  <div class="rng"><span id="aMinT"></span><input type="range" id="aMin" min="40" max="130" value="40"><input type="range" id="aMax" min="40" max="130" value="130"><span id="aMaxT"></span></div>
  <div class="cnt" id="cnt"></div>
  <div id="aptList"></div>
 </div>
 <div class="pane about" id="p-about"></div>
</aside>

<div id="tools">
 <div class="tb lang"><button data-l="ru">RU</button><button data-l="tj">TJ</button><button data-l="en">EN</button></div>
 <button class="tb" id="bHome">⌂ <span class="tx" data-i="bHome"></span></button>
 <button class="tb" id="bNight">☾ <span class="tx" data-i="bNight"></span></button>
 <button class="tb" id="bRot">⟳ <span class="tx" data-i="bRot"></span></button>
 <button class="tb" id="bSun">☀</button>
 <button class="tb" id="bFs">⛶</button>
</div>

<div id="sunbox">☀ <input type="range" id="sunH" min="5.5" max="21.5" step="0.25" value="15"><span id="sunT">15:00</span><select id="sunM"></select></div>
<div id="hud"><div><div class="big" id="hudN"></div></div><div class="lab" id="hudL"></div>
 <button class="tb" id="hUp">▲</button><button class="tb" id="hDn">▼</button><button class="tb" id="hX">✕</button></div>

const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new V2(innerWidth/2,innerHeight/2),.15,.45,.9);if(!MOBILE)composer.addPass(bloom);composer.addPass(new OutputPass());
function applyOffset(){const sideOn=innerWidth>=820&&!$('#side').classList.contains('hide')&&!tour.on&&!viewMode;if(sideOn)camera.setViewOffset(innerWidth,innerHeight,-180,0,innerWidth,innerHeight);else camera.clearViewOffset()}
new MutationObserver(applyOffset).observe(document.getElementById('side'),{attributes:true});
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);labelR.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();applyOffset();tour.cam.aspect=innerWidth/innerHeight;tour.cam.updateProjectionMatrix()});
const clock=new THREE.Clock();let fr=0,acc=0;
function loop(){requestAnimationFrame(loop);const d0=clock.getDelta();if(MOBILE){acc+=d0;if(acc<1/32)return;}const dt=Math.min(MOBILE?acc:d0,.05);acc=0;fr++;cloudMat.uniforms.uTime.value+=dt;
 if(tour.on&&tour.scene){tourUpdate(dt);const ex=renderer.toneMappingExposure;renderer.toneMappingExposure=SUN.night?1.0:.85;renderer.render(tour.scene,tour.cam);renderer.toneMappingExposure=ex;return}
 if(tw){const t=Math.min(1,(performance.now()-tw.s)/tw.d),e=ease(t);camera.position.lerpVectors(tw.p0,tw.p1,e);controls.target.lerpVectors(tw.t0,tw.t1,e);if(t>=1){const cb=tw.cb;tw=null;cb&&cb()}}
 controls.update();updateFX(dt);clouds.position.copy(camera.position);stars.position.copy(camera.position);
 if(MOBILE)renderer.render(scene,camera);else composer.render();labelR.render(scene,camera);if(curFloor!==null&&fr%10===0)declutter()}

/* ===================== INIT ===================== */
setTimeout(()=>{try{
 buildTextures();buildMaterials();buildUnits();buildTreeKinds();buildBuilding();buildRoof();buildSite();flushTrees();buildPickers();
 SUN.m=1;SUN.h=15;$('#sunH').value=15;
 applyOffset();renderStatic();applySeason(1);regenEnv();
 camera.position.set(240,120,380);flyTo(homeP(),HOME.t.clone(),2.8);loop();
 setTimeout(()=>{$('#load').style.opacity=0;setTimeout(()=>$('#load').remove(),900)},300);window.__ready=true}catch(err){console.error(err);$('#loadTxt').textContent='Ошибка: '+err.message;window.__err=String(err.stack||err)}},60);

</script>
</body>
</html>
